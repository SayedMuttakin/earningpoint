<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zenivio - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #151350;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
      text-align: center;
    }
    .content-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 100%;
    }
    .img-wrapper {
      width: 240px;
      max-width: 80vw;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrapper img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #151350;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #64748b;
      font-weight: 500;
      max-width: 290px;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #5542bf;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 38px;
      border-radius: 9999px;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(85, 66, 191, 0.35);
      transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    .btn:active {
      transform: scale(0.96);
      background-color: #4837ab;
    }
    .btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }
    .icon {
      width: 18px;
      height: 18px;
      stroke-width: 2.6;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s;
    }
    .spin {
      animation: rotate 0.85s linear infinite;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .toast {
      display: none;
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      color: #e11d48;
      background-color: #ffe4e6;
      border: 1px solid #fecdd3;
      padding: 10px 16px;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

      <h1>No Internet Connection</h1>
      <p>It seems you're offline. Please check your network connection and try again.</p>
      <button id="retry-btn" class="btn" onclick="retryConnection()">
        <svg id="spinner" class="icon" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.83 6.72 2.24L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        <span id="btn-text">Try Again</span>
      </button>
      <div id="error-toast" class="toast">
        Still offline. Please check Wi-Fi / Mobile Data and try again.
      </div>
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://zenivio.it.com';
    let isRetrying = false;

    function navigateHome() {
      window.location.href = TARGET_URL;
    }

    async function checkOnline() {
      if (!navigator.onLine) return false;
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        await fetch(TARGET_URL + '/api/health?t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store',
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return true;
      } catch (err) {
        return navigator.onLine;
      }
    }

    async function retryConnection() {
      if (isRetrying) return;
      isRetrying = true;

      const btn = document.getElementById('retry-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('spinner');
      const toast = document.getElementById('error-toast');

      btn.disabled = true;
      spinner.classList.add('spin');
      btnText.textContent = 'Checking...';
      toast.style.display = 'none';

      try {
        const ok = await checkOnline();
        if (ok) {
          btnText.textContent = 'Connecting...';
          navigateHome();
          return;
        }
      } catch (e) {}

      btn.disabled = false;
      spinner.classList.remove('spin');
      btnText.textContent = 'Try Again';
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
      isRetrying = false;
    }

    window.addEventListener('online', () => {
      navigateHome();
    });

    setInterval(async () => {
      if (navigator.onLine) {
        const ok = await checkOnline();
        if (ok) {
          navigateHome();
        }
      }
    }, 4000);
  </script>
